routes:
  /rss/:
    template: main-rss
    content_type: text/xml

  /feed.json/:
    template: feed-json
    content_type: application/feed+json

  /urbanism/feed.json/:
    template: feed-json-urbanism
    content_type: application/feed+json

  /field-notes/feed.json/:
    template: feed-json-field-notes
    content_type: application/feed+json

  /gallery/feed.json/:
    template: feed-json-gallery
    content_type: application/feed+json

  /urbanism/:
    controller: channel
    template: custom-urbanism
    filter: 'primary_tag:urbanism'
    data: tag.urbanism

  /field-notes/:
    controller: channel
    template: custom-field-notes
    filter: 'primary_tag:field-notes'
    data: tag.field-notes

  /gallery/:
    controller: channel
    template: custom-gallery
    filter: 'tag:photography'
    data: tag.photography

  /posts/:
    controller: channel
    template: custom-posts
    filter: 'tag:-[status,note,notes,afterword,listening,hash-crucialtracks,check-ins]'

collections:
  /:
    permalink: /{slug}/
    template: index
    filter: 'tag:-[status,note,notes,afterword,listening,hash-crucialtracks,check-ins]'

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
